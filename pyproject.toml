[project]
name = "nmcpqc"
version = "3.1.0"
description = "NMCP Quality Control Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aind-neuron-reconstruction-io @ git+https://github.com/AllenNeuralDynamics/aind-neuron-reconstruction-io",
    "build>=1.3.0",
    "caveclient>=7.11.0",
    "fastapi[standard]>=0.116.1",
    "pydantic>=2.11.7",
    "pandas>=1.5.3",
    "standard-morph[ccf,data-schema] @ git+https://github.com/AllenInstitute/standard_morph",
]

[project.scripts]
nmcp-qc-serve = "aind.nmcp.qc.main:run"
nmcp-qc-process = "aind.nmcp.qc.tools.process_file:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/aind"]

[tool.uv.sources]
standard-morph = { git = "https://github.com/AllenInstitute/standard_morph" }
aind-neuron-reconstruction-io = { git = "https://github.com/AllenNeuralDynamics/aind-neuron-reconstruction-io" }

[tool.uv]
override-dependencies = ["numpy>=1.26.4,<2"]

[dependency-groups]
dev = ["pytest>=8.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["atlas: loads the real 10 µm CCF atlas (~4.8 GB resident, ~9.4 GB peak); run with -m atlas"]
addopts = "-m 'not atlas'"
